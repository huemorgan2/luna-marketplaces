<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=720">
<title>Luna-Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --text:#f4f4f5; --muted:#a1a1aa; --dim:#71717a;
    --luna-300:#c4b5fd; --luna-400:#a78bfa; --luna-500:#8b5cf6; --luna-600:#7c3aed;
    --hairline:rgba(255,255,255,.07); --hairline2:rgba(255,255,255,.12);
    --glass:rgba(255,255,255,.04); --star:#f5a623;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(139,92,246,.16), transparent 60%),
      radial-gradient(800px 400px at 100% 0%, rgba(124,58,237,.10), transparent 60%),
      #0a0a0f;
    background-attachment:fixed;
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  a{color:var(--luna-400);text-decoration:none}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:999px}
  .wrap{max-width:1100px;margin:0 auto;padding:0 28px}

  header{position:sticky;top:0;z-index:10;background:rgba(10,10,15,.75);backdrop-filter:blur(12px);border-bottom:1px solid var(--hairline)}
  .hbar{display:flex;align-items:center;gap:18px;height:58px}
  .logo{font-weight:700;font-size:17px;cursor:pointer;letter-spacing:-.01em;white-space:nowrap}
  .luna-text{background:linear-gradient(120deg,#c4b5fd 0%,#f0abfc 50%,#fda4af 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo .mp{color:var(--muted);font-weight:500}
  .search{flex:1;max-width:360px;position:relative;margin-left:auto}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--dim)}
  .search input{width:100%;background:var(--glass);border:1px solid var(--hairline);border-radius:9px;color:var(--text);padding:8px 12px 8px 33px;font-size:13.5px;outline:none;font-family:inherit}
  .search input:focus{border-color:rgba(139,92,246,.5)}
  .signin{font-size:13.5px;color:var(--muted);white-space:nowrap}
  .signin:hover{color:var(--luna-300)}

  main{padding:28px 0 70px}
  .pagetitle{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:20px}

  .heroes{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .hero{
    position:relative;min-height:240px;display:flex;align-items:center;
    background:var(--glass);border:1px solid var(--hairline);border-radius:18px;
    padding:28px;cursor:pointer;overflow:hidden;
  }
  .hero:hover{border-color:var(--hairline2)}
  .hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center}
  .hero .cbg{position:absolute;inset:0}
  .hero .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,9,15,.85),rgba(10,9,15,.38) 52%,transparent 74%)}
  .hero .tx{position:relative;z-index:1;max-width:58%}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--luna-400);text-transform:uppercase}
  .hero h2{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:8px 0 10px}
  .hero p{color:#c9c9d6;font-size:14.5px}
  .bigheroes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:44px}
  .hero.big{min-height:300px}

  .shead{display:flex;align-items:baseline;justify-content:space-between;margin:44px 0 16px;padding-top:26px;border-top:1px solid var(--hairline)}
  .shead h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .shead a{font-size:14px;cursor:pointer}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .card{
    background:var(--glass);border:1px solid var(--hairline);border-radius:16px;
    padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:12px;
    transition:border-color .15s;
  }
  .card:hover{border-color:rgba(139,92,246,.45)}
  .card .top{display:flex;gap:14px;align-items:center}
  .card .ic{width:92px;height:92px;border-radius:20px;overflow:hidden;flex-shrink:0;border:1px solid var(--hairline)}
  .card .ic img{width:100%;height:100%;object-fit:cover;display:block}
  .card .nm{font-size:15px;font-weight:700}
  .card .ct{font-size:12px;color:var(--dim)}
  .card .sb{font-size:13px;color:var(--muted);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .foot{display:flex;justify-content:flex-end;align-items:center;gap:10px}
  .lettertile{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;color:rgba(255,255,255,.85)}
  .get{
    background:rgba(255,255,255,.08);color:var(--luna-300);border:none;border-radius:999px;
    padding:6px 18px;font-size:13.5px;font-weight:700;cursor:pointer;flex-shrink:0;font-family:inherit;
  }
  .get:hover{background:rgba(139,92,246,.25)}
  .installed{
    display:inline-flex;align-items:center;gap:6px;color:var(--muted);
    font-size:13px;font-weight:600;padding:6px 12px;border:1px solid var(--hairline);
    border-radius:999px;flex-shrink:0;
  }
  .installed svg{width:13px;height:13px;stroke:#34d399}
  .gear{
    display:inline-flex;align-items:center;justify-content:center;width:31px;height:31px;
    border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--hairline);
    cursor:pointer;flex-shrink:0;color:var(--muted);
  }
  .gear:hover{color:var(--luna-300);border-color:rgba(139,92,246,.45)}
  .gear svg{width:15px;height:15px}

  .rows{display:grid;grid-template-columns:1fr 1fr;column-gap:56px}
  .row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--hairline);cursor:pointer}
  .row:hover .nm{color:var(--luna-300)}
  .row .ic{width:68px;height:68px;border-radius:16px;overflow:hidden;flex-shrink:0;border:1px solid var(--hairline)}
  .row .ic img{width:100%;height:100%;object-fit:cover;display:block}
  .row .tx{flex:1;min-width:0}
  .row .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .sb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .crumb{font-size:13.5px;color:var(--muted);cursor:pointer;margin-bottom:18px;display:inline-block}
  .crumb:hover{color:var(--text)}
  .more{display:block;margin:22px auto 0;background:var(--glass);border:1px solid var(--hairline);color:var(--muted);border-radius:999px;padding:8px 26px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .more:hover{color:var(--luna-300);border-color:rgba(139,92,246,.45)}
  .emptymsg{color:var(--muted);padding:40px 0;text-align:center}
  .hidden{display:none}

  @media(max-width:980px){
    .cards{grid-template-columns:1fr 1fr}
    .rows{grid-template-columns:1fr}
    .card .ic{width:76px;height:76px}
    .hero .tx{max-width:62%}
    .hero h2{font-size:21px}
    .hero img.bg{transform:translateX(18%)}
    .hero .scrim{background:linear-gradient(90deg,rgba(10,9,15,.94),rgba(10,9,15,.6) 55%,rgba(10,9,15,.12) 82%)}
  }
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <div class="logo" onclick="goDiscover()"><span class="luna-text">Luna</span><span class="mp" id="mp-name">-Marketplace</span></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" placeholder="Search plugins…" autocomplete="off">
    </div>
    <a class="signin" id="signin" href="/">Sign in</a>
  </div>
</header>

<main class="wrap">
  <div id="discover">
    <div class="pagetitle">Discover</div>
    <div class="heroes" id="heroes"></div>
    <div id="essentials"></div>
    <div class="bigheroes" id="bigheroes"></div>
    <div id="toppicks"></div>
    <div id="catsections"></div>
  </div>

  <div id="catpage" class="hidden">
    <span class="crumb" onclick="goDiscover()">← Discover</span>
    <div class="pagetitle" id="cat-title"></div>
    <div class="rows" id="cat-rows"></div>
    <button class="more hidden" id="cat-more" onclick="moreRows()">Show more</button>
    <div class="emptymsg hidden" id="cat-empty">Nothing here yet.</div>
  </div>
</main>

<script>
const mpSlug = location.pathname.split('/browse/')[1]?.split('/')[0] || 'official';
const token = localStorage.getItem('mp_token');
const authH = token ? {Authorization: 'Bearer ' + token} : {};

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* Very faint per-category tint over the glass card + gradient covers per category */
const TINTS = {
  connectivity:"139,92,246", ability:"56,189,248", knowledge:"96,165,250",
  automation:"251,191,36", media:"232,121,249", development:"45,212,191",
  games:"251,113,133", communication:"52,211,153", security:"161,161,170",
};
const COVERS = {
  connectivity:"linear-gradient(135deg,#1e1b4b,#312e81 55%,#4c1d95)",
  ability:"linear-gradient(135deg,#2e1065,#4c1d95 55%,#6d28d9)",
  knowledge:"linear-gradient(135deg,#172554,#1e3a8a 60%,#312e81)",
  automation:"linear-gradient(135deg,#3b0764,#581c87 60%,#7c3aed)",
  media:"linear-gradient(135deg,#4a044e,#701a75 55%,#86198f)",
  development:"linear-gradient(135deg,#082f49,#0c4a6e 60%,#312e81)",
  games:"linear-gradient(135deg,#4c0519,#881337 60%,#9d174d)",
  communication:"linear-gradient(135deg,#042f2e,#134e4a 60%,#1e3a8a)",
  security:"linear-gradient(135deg,#1c1917,#292524 60%,#3f3f46)",
};
const tint = c => `radial-gradient(130% 130% at 0% 0%, rgba(${TINTS[c]||"139,92,246"},.07), transparent 55%), rgba(255,255,255,.03)`;

const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>`;
const ICON_GEAR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;

/* Installed state comes from the Luna handshake (/api/me/installed) when signed in. */
let INSTALLED = {}, SETTINGS = {}, LUNA_URL = null;
const isInstalled = p => p.name in INSTALLED;
const hasSettings = p => !!SETTINGS[p.name];
function settingsHref(p){
  return LUNA_URL ? `${LUNA_URL.replace(/\/$/,'')}/settings/plugins/${encodeURIComponent(p.name)}` : null;
}
function gearBtn(p){
  if (!hasSettings(p)) return "";
  const href = settingsHref(p);
  const inner = `<span class="gear" title="Settings for ${esc(p.name)} in Luna">${ICON_GEAR}</span>`;
  return href ? `<a href="${esc(href)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${inner}</a>` : "";
}
const installUi = p => isInstalled(p)
  ? `<span class="installed">${ICON_CHECK}Installed</span>${gearBtn(p)}`
  : `<button class="get" onclick="event.stopPropagation();openPlugin('${esc(p.name)}')">Install</button>`;

function iconHtml(p){
  const icon = (p.media||[]).find(m => m.kind === 'icon');
  const url = icon ? icon.url : (p.icon_url && /^(https?:)?\//.test(p.icon_url) ? p.icon_url : null);
  if (url) return `<img src="${esc(url)}" alt="">`;
  const letter = (p.name||'?').replace(/^plugin-/,'').charAt(0).toUpperCase();
  return `<div class="lettertile" style="background:${COVERS[p.category]||COVERS.connectivity};font-size:34px">${esc(letter)}</div>`;
}
function coverBg(p){
  const cover = (p.media||[]).find(m => m.kind === 'cover');
  if (cover) return `<img class="bg" src="${esc(cover.url)}" alt=""><div class="scrim"></div>`;
  return `<div class="cbg" style="background:radial-gradient(120% 170% at 85% 15%, rgba(${TINTS[p.category]||'139,92,246'},.28), transparent 60%), rgba(255,255,255,.02)"></div><div class="scrim"></div>`;
}
const displayName = p => esc((p.name||'').replace(/^plugin-/,'').replace(/-/g,' ').replace(/\b\w/g, c => c.toUpperCase()));

function openPlugin(name){ location.href = `/browse/${mpSlug}/plugin/${encodeURIComponent(name)}`; }

function heroCard(p, cls){
  const kicker = p.kicker || (p.category ? p.category.charAt(0).toUpperCase()+p.category.slice(1) : 'Featured');
  return `<div class="hero${cls?' '+cls:''}" onclick="openPlugin('${esc(p.name)}')">
    ${coverBg(p)}
    <div class="tx"><span class="kicker">${esc(kicker)}</span><h2>${p.hero_title?esc(p.hero_title):displayName(p)}</h2><p>${esc(p.hero_sub||p.description||'')}</p></div>
  </div>`;
}
function card(p){
  return `<div class="card" style="background:${tint(p.category)}" onclick="openPlugin('${esc(p.name)}')">
    <div class="top">
      <div class="ic">${iconHtml(p)}</div>
      <div><div class="nm">${displayName(p)}</div><div class="ct">v${esc(p.latest_version||'')}</div></div>
    </div>
    <div class="sb">${esc(p.description||'')}</div>
    <div class="foot">${installUi(p)}</div>
  </div>`;
}
function section(title, plugins, more){
  if (!plugins.length) return "";
  return `<div class="shead"><h2>${esc(title)}</h2>${more||""}</div>
    <div class="cards">${plugins.map(card).join("")}</div>`;
}
function row(p){
  return `<div class="row" onclick="openPlugin('${esc(p.name)}')">
    <div class="ic">${iconHtml(p)}</div>
    <div class="tx"><div class="nm">${displayName(p)}</div><div class="sb">${esc(p.description||'')}</div></div>
    ${installUi(p)}
  </div>`;
}

let DISCOVER = null;

async function loadInstalled(){
  if (!token) return;
  try{
    const r = await fetch('/api/me/installed', {headers: authH});
    if (!r.ok) return;
    const d = await r.json();
    INSTALLED = d.installed || {}; SETTINGS = d.settings || {}; LUNA_URL = d.luna_base_url;
  }catch(e){}
}

async function loadDiscover(){
  const r = await fetch(`/api/catalog/${mpSlug}/discover`);
  if (!r.ok){ document.getElementById('heroes').innerHTML = '<div class="emptymsg">Marketplace not found.</div>'; return; }
  DISCOVER = await r.json();
  if (DISCOVER.marketplace.slug !== 'official')
    document.getElementById('mp-name').textContent = ' ' + DISCOVER.marketplace.name;
  document.getElementById('heroes').innerHTML = DISCOVER.heroes.map(p => heroCard(p)).join('');
  document.getElementById('essentials').innerHTML = section('Essentials', DISCOVER.essentials);
  document.getElementById('bigheroes').innerHTML = DISCOVER.features.map(p => heroCard(p, 'big')).join('');
  document.getElementById('toppicks').innerHTML = section('Top picks', DISCOVER.top_picks);
  document.getElementById('catsections').innerHTML = DISCOVER.categories.map(c => {
    const more = c.total >= 4 ? `<a onclick="openCat('${esc(c.slug)}','${esc(c.label)}')">More ${esc(c.label)} »</a>` : "";
    return section(c.label, c.plugins, more);
  }).join('');
}

/* category page with pagination (24/page) */
let catRows = [], catShown = 0, catQuery = null;
const PAGE = 24;
function renderRows(){
  catShown = Math.min(catRows.length, catShown + PAGE);
  document.getElementById('cat-rows').innerHTML = catRows.slice(0, catShown).map(row).join('');
  document.getElementById('cat-more').classList.toggle('hidden', catShown >= catRows.length);
  document.getElementById('cat-empty').classList.toggle('hidden', catRows.length > 0);
}
function moreRows(){ renderRows(); }
async function openCat(slug, label){
  document.getElementById('cat-title').textContent = label;
  const r = await fetch(`/api/catalog/${mpSlug}?category=${encodeURIComponent(slug)}&sort=downloads`);
  catRows = r.ok ? await r.json() : [];
  catShown = 0; renderRows(); page('catpage');
}
function goDiscover(){ document.getElementById('q').value=''; page('discover'); }
function page(id){
  for (const v of ['discover','catpage'])
    document.getElementById(v).classList.toggle('hidden', v !== id);
  scrollTo(0,0);
}

/* search: full catalog, filtered client-side */
let ALL = null, qTimer = null;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => doSearch(e.target.value.trim()), 180);
});
async function doSearch(q){
  if (!q){ goDiscover(); return; }
  if (!ALL){
    const r = await fetch(`/api/catalog/${mpSlug}?per_page=200`);
    ALL = r.ok ? await r.json() : [];
  }
  const needle = q.toLowerCase();
  catRows = ALL.filter(p =>
    p.name.toLowerCase().includes(needle) ||
    (p.description||'').toLowerCase().includes(needle) ||
    (p.tags||[]).some(t => t.toLowerCase().includes(needle)));
  document.getElementById('cat-title').textContent = `Results for "${q}"`;
  catShown = 0; renderRows(); page('catpage');
}

async function me(){
  if (!token) return;
  try{
    const r = await fetch('/api/auth/me', {headers: authH});
    if (r.ok){
      const u = await r.json();
      const el = document.getElementById('signin');
      el.textContent = u.username; el.href = '/';
    }
  }catch(e){}
}

(async () => { await loadInstalled(); await Promise.all([loadDiscover(), me()]); })();

/* Reflow (not shrink) down to 640px, then scale the whole page. */
const MIN_W = 640;
function fitScale(){ document.documentElement.style.zoom = Math.min(1, window.innerWidth / MIN_W) || 1; }
addEventListener('resize', fitScale);
fitScale();
</script>
</body>
</html>
